# -------------------------------------------------------------------
# Physical jtag interface configuration file for openOCD.
# -------------------------------------------------------------------

# set INTERFACE if not defined
if {![info exists INTERFACE]} {
  set INTERFACE ftdi
}

# FTDI (For Digilent JTAG HS2, our case!)
if { $INTERFACE == "ftdi" } {

  # Tells OpenOCD to use the FTDI driver to communicate with the probe.
  adapter driver ftdi

  # Identifies the specific USB device to connect to.
  # 0x0403 = FTDI's USB vendor ID (all FTDI chips share this)
  # 0x6014 = product ID for the FT232H chip inside the HS2
  # OpenOCD scans all connected USB devices and connects to the one matching
  ftdi vid_pid 0x0403 0x6014

  # The FT232H chip inside the HS2 has two independent MPSSE channels
  # (channel 0 and channel 1). Channel 0 is the one wired to the JTAG
  # pins (TCK, TDI, TDO, TMS) on the HS2 connector (CH1 is for SPI)
  ftdi channel 0

  # Configures the initial state of the FTDI GPIO pins at startup.
  #
  # Direction mask 0x008b = 0000 1000 1011 in binary:
  #   Bits set to 1 = output pins (TCK, TDI, TMS, and one control pin)
  #   Bits set to 0 = input pins  (TDO)
  #
  # Value mask 0x0088 = 0000 1000 1000 in binary:
  #   Sets the initial logic level of each output pin before JTAG starts.
  #   TCK starts low, TMS starts high (JTAG reset state), TDI starts low.
  #   This ensures the JTAG TAP on the NEORV32 starts in a known reset state
  ftdi layout_init 0x0088 0x008b

  # Sets the JTAG clock frequency to 2000 kHz (2 MHz).
  # The HS2 supports frequencies from 8 kHz up to 30 MHz.
  # 2 MHz is a safe conservative value for Pmod connections
  # If the connection is stable you can increase it to 5000 or 10000.
  adapter speed 2000

  # Explicitly selects JTAG as the debug transport protocol.
  # OpenOCD supports multiple transport protocols (JTAG, SWD, SWIM etc).
  # NEORV32 only implements JTAG so this must always be set to jtag.
  transport select jtag

# Invalid
} else {
  echo "ERROR: Invalid INTERFACE selection ($INTERFACE)."
  exit
}
